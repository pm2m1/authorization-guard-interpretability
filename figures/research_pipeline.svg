<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" role="img" aria-labelledby="t d">
<title id="t">Research pipeline</title>
<desc id="d">Data flow from synthetic scenarios and oracle through local model scoring, activation capture, scenario-disjoint probes, a separate answer-interface diagnostic and checksum-based integrity verification.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0b0b0b}
.bg{fill:#fcfcfb}.title{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#52514e}
.t{font-size:13px}.s{font-size:12px;fill:#52514e}.b{font-weight:600}.mut{fill:#898781}.ink2{fill:#52514e}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.ref{stroke:#52514e;stroke-width:1.5}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
.ring{stroke:#fcfcfb;stroke-width:2}.outline{fill:none;stroke:#52514e;stroke-width:1.5}
.box{fill:#f3f2ee;stroke:#c3c2b7;stroke-width:1}.boxa{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}
.boxb{fill:#fdeee7;stroke:#eb6834;stroke-width:1.2}.boxc{fill:#e6f5ef;stroke:#1baf7a;stroke-width:1.2}
.cellf{fill:#2a78d6}.celll{fill:#e1e0d9}.arrow{stroke:#52514e;stroke-width:1.5;fill:none}.head{fill:#52514e}
.hatch{stroke:#2a78d6;stroke-width:2}.hatchbg{fill:#fcfcfb}.sep{stroke:#c3c2b7;stroke-width:1}
@media (prefers-color-scheme: dark){
text{fill:#f0efec}.bg{fill:#1a1a19}.sub,.s,.ink2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}
.ring{stroke:#1a1a19}.outline{stroke:#c3c2b7}.box{fill:#242422;stroke:#4a4a46}.boxa{fill:#1b2a3d;stroke:#3987e5}
.boxb{fill:#3a2219;stroke:#d95926}.boxc{fill:#16302a;stroke:#199e70}.cellf{fill:#3987e5}.celll{fill:#383835}
.arrow{stroke:#c3c2b7}.head{fill:#c3c2b7}.hatch{stroke:#3987e5}.hatchbg{fill:#1a1a19}.sep{stroke:#383835}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect class="hatchbg" width="6" height="6"/><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<rect class="bg" width="900" height="712" rx="8"/>
<text x="20.0" y="32.0" class="title">Research pipeline</text>
<text x="20.0" y="52.0" class="sub">Offline evaluation of a local model on synthetic items. No production service; no tool or external action is executed.</text>
<rect x="20" y="72" width="250" height="96" rx="6" class="box"/>
<text x="32.0" y="94.0" class="t b" style="font-size:13px">Synthetic scenarios</text>
<text x="32.0" y="112.0" class="s" style="font-size:12px">24 base scenarios → 864 items</text>
<text x="32.0" y="130.0" class="s" style="font-size:12px">432 direct (primary) · 432 dual (stress)</text>
<text x="32.0" y="148.0" class="s" style="font-size:12px">generate.py, seed 20261125</text>
<rect x="300" y="72" width="250" height="96" rx="6" class="box"/>
<text x="312.0" y="94.0" class="t b" style="font-size:13px">Formal oracle</text>
<text x="312.0" y="112.0" class="s" style="font-size:12px">three-valued (Kleene) evaluation</text>
<text x="312.0" y="130.0" class="s" style="font-size:12px">status TRUE / FALSE / UNKNOWN /</text>
<text x="312.0" y="148.0" class="s" style="font-size:12px">INCONSISTENT → expected decision</text>
<path class="arrow" d="M270.0,120.0 L298.0,120.0" marker-end="url(#ah)"/>
<rect x="20" y="206" width="530" height="76" rx="6" class="boxa"/>
<text x="32.0" y="228.0" class="t b" style="font-size:13px">Qwen3.5-9B · bf16 · Hugging Face transformers · Apple MPS (local)</text>
<text x="32.0" y="246.0" class="s" style="font-size:12px">official chat template; forced-choice scoring of ALLOW / DENY / REQUEST_EVIDENCE / ESCALATE</text>
<text x="32.0" y="264.0" class="s" style="font-size:12px">forward hooks record the residual stream (read-only)</text>
<path class="arrow" d="M145.0,168.0 L145.0,204.0" marker-end="url(#ah)"/>
<text x="152.0" y="190.0" class="s">items</text>
<rect x="20" y="320" width="250" height="76" rx="6" class="box"/>
<text x="32.0" y="342.0" class="t b" style="font-size:13px">Behavioural labels</text>
<text x="32.0" y="360.0" class="s" style="font-size:12px">decision, margin, confidence (864)</text>
<text x="32.0" y="378.0" class="s" style="font-size:12px">error = decision ≠ oracle decision</text>
<rect x="290" y="320" width="260" height="76" rx="6" class="box"/>
<text x="302.0" y="342.0" class="t b" style="font-size:13px">Activations</text>
<text x="302.0" y="360.0" class="s" style="font-size:12px">blocks 7, 15, 23, 31 × 2 positions × 4096</text>
<text x="302.0" y="378.0" class="s" style="font-size:12px">float16 (not distributed)</text>
<path class="arrow" d="M145.0,282.0 L145.0,318.0" marker-end="url(#ah)"/>
<path class="arrow" d="M420.0,282.0 L420.0,318.0" marker-end="url(#ah)"/>
<rect x="20" y="436" width="530" height="124" rx="6" class="boxc"/>
<text x="32.0" y="458.0" class="t b" style="font-size:13px">Linear probes on stored activations (offline, CPU)</text>
<text x="32.0" y="475.0" class="s" style="font-size:12px">Task A · decode oracle status (4 classes)</text>
<text x="32.0" y="492.0" class="s" style="font-size:12px">Task B · predict the model&#x27;s errors</text>
<text x="32.0" y="509.0" class="s" style="font-size:12px">Scenario-disjoint: leave-one-scenario-out over 24 scenarios;</text>
<text x="32.0" y="526.0" class="s" style="font-size:12px">fold-local preprocessing; shuffled-label controls; cluster bootstrap</text>
<text x="32.0" y="543.0" class="s" style="font-size:12px">Baselines: output margin, TF-IDF, text + margin, construction-aware features</text>
<path class="arrow" d="M145.0,396.0 L145.0,434.0" marker-end="url(#ah)"/>
<text x="152.0" y="420.0" class="s">Task B labels, margin</text>
<path class="arrow" d="M420.0,396.0 L420.0,434.0" marker-end="url(#ah)"/>
<path class="arrow" d="M550.0,120.0 L572.0,120.0 L572.0,416.0 L500.0,416.0 L500.0,434.0" marker-end="url(#ah)"/>
<text x="580.0" y="300.0" class="s">oracle</text>
<text x="580.0" y="316.0" class="s">labels</text>
<rect x="630" y="206" width="250" height="190" rx="6" class="boxb"/>
<text x="642.0" y="228.0" class="t b" style="font-size:13px">Answer-interface diagnostic</text>
<text x="642.0" y="249.0" class="s" style="font-size:12px">separate behavioural evaluation</text>
<text x="642.0" y="270.0" class="s" style="font-size:12px">144 items: 72 CONFLICT + 72 controls</text>
<text x="642.0" y="291.0" class="s" style="font-size:12px">4 label interfaces (A–D)</text>
<text x="642.0" y="312.0" class="s" style="font-size:12px">3 scoring normalisations</text>
<text x="642.0" y="333.0" class="s" style="font-size:12px">free-generation agreement check</text>
<text x="642.0" y="354.0" class="s" style="font-size:12px">no activations · no intervention</text>
<path class="arrow" d="M550.0,252.0 L628.0,252.0" marker-end="url(#ah)"/>
<text x="580.0" y="226.0" class="s">same</text>
<text x="580.0" y="242.0" class="s">model</text>
<rect x="20" y="600" width="860" height="64" rx="6" class="box"/>
<text x="32.0" y="622.0" class="t b" style="font-size:13px">Preserved raw outputs → SHA-256 manifest → verify_integrity.py</text>
<text x="32.0" y="640.0" class="s" style="font-size:12px">standard library only; recomputes headline counts from raw log-probs without the model</text>
<path class="arrow" d="M285.0,560.0 L285.0,598.0" marker-end="url(#ah)"/>
<path class="arrow" d="M755.0,396.0 L755.0,598.0" marker-end="url(#ah)"/>
<text x="20.0" y="694.0" class="s mut">Arrows show data flow. Probes read stored activations after the forward passes and do not feed back into the model.</text>
</svg>
