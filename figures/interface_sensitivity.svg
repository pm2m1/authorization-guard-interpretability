<text x="20.0" y="516.0" class="s">Mapping D&#x27;s total-score result (35/72) fails the agreement check: the model answers “X = DECISION”, which the scored</text>
<text x="20.0" y="534.0" class="s">continuation “X\n” penalises. It is not a verified improvement. The first-token figure (19/72) is the better-supported</text>
<text x="20.0" y="552.0" class="s">sensitivity result, not a validated replacement. Gap: 22.2 percentage points. Free-generation checks cover 12 items per interface.</text>
<text x="20.0" y="570.0" class="s">B&#x27;s first-token scoring also disagreed with generation on 2 of 12 items; it gives 0 escalations under either scoring.</text>
<text x="20.0" y="588.0" class="s mut">Source: experiments/mechinterp/results/label_diag/analysis.json and freegen_by_norm.json</text>
