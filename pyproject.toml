[project]
name = "authorization-guard-interpretability"
version = "0.1.0"
description = "Synthetic authorization-evidence dataset (generator, oracle, tests). The mechanistic-interpretability pilot has its own locked environment in experiments/mechinterp/."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authorization_closure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "mutation: deliberate-oracle-defect tests (mutation analysis)",
]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/authorization_closure/generate.py" = ["E501"]  # verbatim prompt text must not be re-wrapped
"scripts/generate_figures.py" = ["E501"]  # long caption and SVG-path strings
