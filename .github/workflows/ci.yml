# CPU-only checks. No model weights are downloaded or loaded; no experiments are run.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-root-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          python-version: "3.12"
      - name: Raw-result checksums
        working-directory: experiments/mechinterp
        run: sha256sum -c manifests/raw_results.sha256
      - name: Standard-library integrity verification
        working-directory: experiments/mechinterp
        run: python3 scripts/verify_integrity.py
      - name: Figures regenerate unchanged
        run: |
          python3 scripts/generate_figures.py
          git diff --exit-code -- figures/
      - name: Root tests (dataset generator and oracle)
        run: uv run --frozen pytest -q
      - name: Ruff
        run: uv run --frozen ruff check .

  mechinterp-tests:
    # macOS arm64: the locked torch wheel here is the small CPU/MPS build; on Linux the same lock pulls CUDA packages.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/mechinterp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          python-version: "3.12"
          working-directory: experiments/mechinterp
      - name: Tests (no model loading)
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --frozen pytest -q tests
      - name: Ruff
        run: uv run --frozen ruff check .
